

services:
  # BASE DE DATOS POSTGRES + PGVECTOR
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: doc_store
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # BACKEND SPRING BOOT
  backend:
    build:
      context: ../kawzay-Spring
    depends_on:
      - pgvector
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/doc_store
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret123
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    restart: unless-stopped

  # FRONTEND USUARIO (React)
  frontend-usuario:
    build:
      context: ./src/front-end
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  # FRONTEND ADMIN (React)
  frontend-admin:
    build:
      context: ../Kawzay-Django/frontend_react_admin
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  pgdata:
