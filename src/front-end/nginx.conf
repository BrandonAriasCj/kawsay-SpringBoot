server {
    listen 80;
    server_name 18.128.125.68;

    root /usr/share/nginx/html;
    index index.html;

    # 🔵 Sirve la SPA (React, Vue, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 🔶 Proxy para la API Spring Boot
    location /api/ {
        proxy_pass http://18.119.253.100:8081;  # ⚠️ Cambia esto
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ✅ Encabezados CORS necesarios
        add_header 'Access-Control-Allow-Origin' 'http://18.119.253.100:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ✅ Maneja solicitudes preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            return 204;
        }
    }
}
